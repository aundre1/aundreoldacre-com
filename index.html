<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aundre Oldacre</title>
<meta name="author" content="Aundre Oldacre"/>
<meta property="og:url" content="https://aundreoldacre.com/"/>
<meta property="og:site_name" content="Aundre Oldacre"/>
<meta property="og:title" content="Aundre Oldacre"/>
<meta property="og:type" content="website"/>
<meta property="og:image" content="https://img1.wsimg.com/isteam/getty/1399553173"/>
<meta property="og:locale" content="en_US"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="Aundre Oldacre"/>
<meta name="twitter:description" content="Building Dreams, Creating Communities"/>
<meta name="twitter:image" content="https://img1.wsimg.com/isteam/getty/1399553173"/>
<meta name="theme-color" content="#1a1a1a"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#faf9f7;
    --line:rgba(255,255,255,.35);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Source Sans Pro',sans-serif;
    color:var(--paper);
    background:var(--ink);
    min-height:100vh;
  }
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.35) 40%, rgba(10,10,10,.75) 100%),
      url('https://img1.wsimg.com/isteam/getty/1399553173/:/rs=w:1535,m') center/cover no-repeat;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px clamp(20px,5vw,64px);
  }
  .brand{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:14px;
  }
  nav a{
    color:var(--paper);
    text-decoration:none;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    border:1px solid var(--line);
    padding:10px 20px;
    border-radius:2px;
    transition:background .2s ease;
  }
  nav a:hover{background:rgba(255,255,255,.1)}
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px 80px;
  }
  h1{
    font-family:'Playfair Display',serif;
    font-weight:900;
    font-size:clamp(2.5rem,7vw,5rem);
    margin:0 0 18px;
    line-height:1.05;
  }
  .tagline{
    font-family:'Source Sans Pro',sans-serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1.1rem,2.2vw,1.5rem);
    letter-spacing:.02em;
    margin:0 0 46px;
    color:rgba(250,249,247,.9);
  }
  #contact{
    width:100%;
    max-width:520px;
    text-align:left;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    border-radius:6px;
    padding:clamp(24px,4vw,40px);
    backdrop-filter:blur(2px);
  }
  #contact h2{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  #contact p.lede{
    margin:0 0 22px;
    color:rgba(250,249,247,.75);
    font-size:.95rem;
  }
  label{
    display:block;
    font-size:.8rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 6px;
    color:rgba(250,249,247,.8);
  }
  input,textarea{
    width:100%;
    font-family:inherit;
    font-size:1rem;
    padding:.65em .75em;
    margin:0 0 18px;
    background:rgba(255,255,255,.92);
    color:#1a1a1a;
    border:none;
    border-radius:3px;
  }
  textarea{min-height:110px;resize:vertical}
  button{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:.85rem;
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:3px;
    padding:.9em 2em;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  button:hover{opacity:.85}
  footer{
    text-align:center;
    font-size:.75rem;
    color:rgba(250,249,247,.55);
    padding:20px;
  }
  footer a{color:inherit}
</style>
</head>
<body>
<div class="hero">
  <header>
    <div class="brand">Aundre Oldacre</div>
    <nav><a href="mailto:videomixer@gmail.com">Contact</a></nav>
  </header>
  <main>
    <h1>Aundre Oldacre</h1>
    <p class="tagline">Building Dreams, Creating Communities</p>

    <section id="contact">
      <h2>Get in Touch</h2>
      <p class="lede">Drop a line below — it opens directly in your email client.</p>
      <form action="mailto:videomixer@gmail.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name"/>
        <label for="email">Email*</label>
        <input id="email" name="email" type="email" required autocomplete="email"/>
        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <footer>
    &copy; 2026 Aundre Oldacre &middot; All Rights Reserved.
  </footer>
</div>
</body>
</html>
